<text x="36.6" y="381.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запись</tspan></text>
<text x="36.6" y="401.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">о заведении</tspan></text>
