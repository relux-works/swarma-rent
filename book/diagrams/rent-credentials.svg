<svg xmlns="http://www.w3.org/2000/svg" width="837.2" height="872.2" viewBox="0 0 837.2 872.2">
<title>Путь токена арендатора: арендатор заводит токен у брокера своего хоста, службы хоста тратят его за агента после проверки права агента, а в конце аренды токен уничтожается и отзывается.</title>
<rect width="837.2" height="872.2" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(58.7 0)">
<!-- group host -->
<rect x="130.8" y="0" width="392.5" height="848.2" rx="16" fill="none" stroke="#7c4ddb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="host"/>
<!-- group label host -->
<rect x="142.8" y="10" width="154.8" height="18.9" fill="#ffffff" class="plate"/>
<text x="148.8" y="24.4" font-size="13" fill="#6a3fc8" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ХОСТ АРЕНДАТОРА</tspan></text>
<line x1="0" y1="108.6" x2="0" y2="840.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
