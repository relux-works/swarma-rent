<text x="389.2" y="92.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">шлюз, служба</tspan></text>
<text x="403.8" y="111.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">действий</tspan></text>
