<circle cx="247.3" cy="448.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="243.6" y="452.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="262.3" y="452.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запрос агента:</tspan></text>
<text x="262.3" y="472.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">поля доверенности</tspan></text>
