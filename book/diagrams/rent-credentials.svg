<text x="275.7" y="324.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подпись, бронь,</tspan></text>
<text x="275.7" y="344.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">система манифеста</tspan></text>
