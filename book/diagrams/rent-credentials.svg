<line x1="692.2" y1="132" x2="692.2" y2="840.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node renter -->
<rect x="-58.7" y="37.7" width="117.5" height="70.9" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="renter"/>
<text x="-42.7" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Арендатор</tspan></text>
<text x="-26.5" y="92.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">браузер</tspan></text>
