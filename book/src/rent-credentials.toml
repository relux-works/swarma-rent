# The path of a renter's token: enrolment, use and removal, as a sequence.
# Content follows the chapter "Учётные данные арендатора" (sections
# "Заведение", "Использование", "Удаление"). Shared services only carry the
# ciphertext and are not drawn as a lifeline. The credential gateway and the
# action service share one lifeline: the first serves reads, the second every
# write. The agent's slot is not drawn: it holds a placeholder and never the
# token, and its request arrives at the services as step 5.
layout = "sequence"
alt = "Путь токена арендатора: арендатор заводит токен у брокера своего хоста, службы хоста тратят его за агента после проверки права агента, а в конце аренды токен уничтожается и отзывается."

[theme.space]
seq_row_gap = 8
seq_node_width = 132
seq_label_width = 150
seq_self_width = 170
seq_column_gap = 20

[groups.host]
label = "Хост арендатора"
role = "agent"

[nodes.renter]
role = "human"
name = "Арендатор"
text = "браузер"

[nodes.broker]
group = "host"
role = "store"
name = "Брокер"
text = "ключ приёма"

[nodes.services]
group = "host"
role = "service"
name = "Службы хоста"
text = "шлюз, служба действий"

[nodes.system]
role = "external"
name = "Система арендатора"
text = "хостинг кода"

[[seq]]
from = "renter"
to = "system"
step = 1
label = "создаёт токен с узкой областью"

[[seq]]
from = "renter"
to = "broker"
step = 2
label = "запрос с подписью, шифротекст"

[[seq]]
from = "broker"
to = "broker"
step = 3
label = "подпись, бронь, система манифеста"

[[seq]]
from = "broker"
to = "renter"
step = 4
label = "запись о заведении"

[[seq]]
from = "services"
to = "services"
step = 5
label = "запрос агента: поля доверенности"

[[seq]]
from = "broker"
to = "services"
step = 6
label = "служебная аренда токена"

[[seq]]
from = "services"
to = "system"
step = 7
label = "чтение или запись"

[[seq]]
divider = "Конец аренды"

[[seq]]
from = "services"
to = "system"
step = 8
label = "отзыв токена адаптером"

[[seq]]
from = "broker"
to = "renter"
step = 9
label = "запись об удалении"

[[seq]]
from = "renter"
to = "system"
step = 10
label = "отзывает токен сам"
